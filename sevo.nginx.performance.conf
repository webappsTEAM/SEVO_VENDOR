# 1. Customer Application Frontend & Proxies (sevo.co.in, www.sevo.co.in)
server {
    server_name sevo.co.in www.sevo.co.in;

    client_max_body_size 50M;

    root /var/www/calservices/current-customer/frontend/dist;
    index index.html;

    # Customer Core API Proxy (Port 8000)
    location /api/ {
        proxy_pass http://127.0.0.1:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300;
        proxy_connect_timeout 60;
    }

    # Daphne WebSocket ASGI Layer (Port 8002)
    location /ws/ {
        proxy_pass http://127.0.0.1:8002;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600;
        proxy_send_timeout 3600;
    }

    # Static Assets & Media
    location /static/ {
        alias /var/www/calservices/staticfiles/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    location /media/ {
        alias /var/www/calservices/shared/media/;
        expires 7d;
        add_header Cache-Control "public";
    }

    # Vite names every production asset with a content hash.  These files can
    # be cached indefinitely: a new deployment produces new URLs, while the
    # HTML entry point below remains explicitly non-cacheable.
    location ^~ /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }


    # === Sevo Policy Pages (static HTML) ===
    location /privacy/sevo/ {
        alias /var/www/sevo-policies/;
        try_files sevo-privacy.html =404;
        add_header Cache-Control "no-cache";
    }

    location /privacy/sevo-partner/ {
        alias /var/www/sevo-policies/;
        try_files sevo-partner-privacy.html =404;
        add_header Cache-Control "no-cache";
    }

    location /account-deletion/ {
        alias /var/www/sevo-policies/;
        try_files account-deletion.html =404;
        add_header Cache-Control "no-cache";
    }
    # =========================================

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0" always;
    }

    access_log /var/www/calservices/logs/nginx/customer_access.log;
    error_log /var/www/calservices/logs/nginx/customer_error.log;

    listen [::]:443 ssl ipv6only=on; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/sevo.co.in/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/sevo.co.in/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot


}

# 2. Vendor / Workforce Application Frontend & Proxies (vendor.sevo.co.in)
server {
    server_name vendor.sevo.co.in;

    client_max_body_size 50M;

    root /var/www/calservices/current-vendor/frontend/dist;
    index index.html;

    # Vendor Workforce API Proxy (Port 8001)
        # Dedicated Realtime SSE Stream Endpoint (Non-buffering, Long-lived)
    location /api/workforce/realtime/stream/ {
        proxy_pass http://127.0.0.1:8001/api/workforce/realtime/stream/;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

location /api/ {
        proxy_pass http://127.0.0.1:8001/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300;
        proxy_connect_timeout 60;
    }

    # Static Assets & Media
    location /static/ {
        alias /var/www/calservices/staticfiles/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    location /media/ {
        alias /var/www/calservices/shared/media/;
        expires 7d;
        add_header Cache-Control "public";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    access_log /var/www/calservices/logs/nginx/vendor_access.log;
    error_log /var/www/calservices/logs/nginx/vendor_error.log;

    listen [::]:443 ssl; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/sevo.co.in/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/sevo.co.in/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}

